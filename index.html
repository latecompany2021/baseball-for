<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘의 사주</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>오늘의 사주</h1>
        <p>이름을 클릭하면 생일과 운세를 확인할 수 있어요.</p>

        <div id="people">
            <button class="person" data-id="person1">
                김철수
            </button>
        </div>

        <section id="result" hidden>
            <h2 id="person-name"></h2>
            <p id="birthday"></p>

            <button id="fortune-button">
                운세 확인하기
            </button>

            <div id="fortune-result" aria-live="polite"></div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
